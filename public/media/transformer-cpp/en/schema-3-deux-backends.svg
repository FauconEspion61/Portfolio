<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1032 482" width="1032" height="482" role="img" aria-label="Every CPU layer has a GPU mirror built from it with the same weights; an equivalence test compares their outputs, and an identical binary checkpoint format makes the two backends interchangeable.">
<title>TransformerCpp — two backends, one logic</title>
<style>
svg{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#131A1F;--muted:#59686F;--line:#C3CDD2;--cpu:#2F6382;--gpu:#A85C1B;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#0F1418;--surface:#171E23;--ink:#E5EBEE;--muted:#93A3AC;--line:#2C3841;--cpu:#79B4D8;--gpu:#E19A57}}
.bg{fill:var(--bg)}
.t-name{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px;font-weight:500;fill:var(--ink)}
.t-sub{font-size:10.5px;fill:var(--muted)}
.t-lane{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.1em}
.t-edge{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10.5px;fill:var(--muted)}
.t-small{font-size:10px;fill:var(--muted)}
.box-cpu{fill:var(--surface);stroke:var(--cpu);stroke-width:1.3}
.box-gpu{fill:var(--surface);stroke:var(--gpu);stroke-width:1.3}
.box-n{fill:var(--surface);stroke:var(--line);stroke-width:1.3}
.ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.a-ink{fill:var(--ink)}
</style>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon class="a-ink" points="0,0.6 8.4,4.5 0,8.4"/></marker>
</defs>
<rect class="bg" x="-16" y="-16" width="1032" height="482"/>

<text class="t-lane" x="40" y="34" fill="var(--cpu)">CPU REFERENCE</text>
<text class="t-small" x="40" y="50">Matrix · explicit loops · gradients derived by hand</text>

<text class="t-lane" x="560" y="34" fill="var(--gpu)">DEVICE MIRROR</text>
<text class="t-small" x="560" y="50">GpuMatrix · cuBLAS · CUDA kernels</text>

<rect class="box-cpu" x="40" y="70" width="300" height="52" rx="3"/>
<text class="t-name" x="190" y="94" text-anchor="middle">Linear</text>
<text class="t-sub" x="190" y="110" text-anchor="middle">y = xW + b</text>

<rect class="box-cpu" x="40" y="138" width="300" height="52" rx="3"/>
<text class="t-name" x="190" y="162" text-anchor="middle">MultiHeadAttention</text>
<text class="t-sub" x="190" y="178" text-anchor="middle">W_Q, W_K, W_V per head · W_O</text>

<rect class="box-cpu" x="40" y="206" width="300" height="52" rx="3"/>
<text class="t-name" x="190" y="230" text-anchor="middle">Transformer</text>
<text class="t-sub" x="190" y="246" text-anchor="middle">forward · backward · Adam</text>

<rect class="box-gpu" x="560" y="70" width="340" height="52" rx="3"/>
<text class="t-name" x="730" y="94" text-anchor="middle">GpuLinear</text>
<text class="t-sub" x="730" y="110" text-anchor="middle">cuBLAS matmul + add_bias</text>

<rect class="box-gpu" x="560" y="138" width="340" height="52" rx="3"/>
<text class="t-name" x="730" y="162" text-anchor="middle">GpuMultiHeadAttention</text>
<text class="t-sub" x="730" y="178" text-anchor="middle">strided-batched attention</text>

<rect class="box-gpu" x="560" y="206" width="340" height="52" rx="3"/>
<text class="t-name" x="730" y="230" text-anchor="middle">GpuTransformer</text>
<text class="t-sub" x="730" y="246" text-anchor="middle">+ CUDA Graphs · DevicePool</text>

<line class="ln" x1="340" y1="96" x2="556" y2="96" marker-end="url(#a)"/>
<line class="ln" x1="340" y1="164" x2="556" y2="164" marker-end="url(#a)"/>
<line class="ln" x1="340" y1="232" x2="556" y2="232" marker-end="url(#a)"/>
<text class="t-edge" x="448" y="88" text-anchor="middle">built from</text>
<text class="t-edge" x="448" y="156" text-anchor="middle">built from</text>
<text class="t-edge" x="448" y="224" text-anchor="middle">built from</text>
<text class="t-small" x="448" y="278" text-anchor="middle">— same weights —</text>

<rect class="box-n" x="40" y="304" width="860" height="52" rx="3" stroke-dasharray="5 4"/>
<text class="t-name" x="470" y="327" text-anchor="middle">EQUIVALENCE TEST</text>
<text class="t-sub" x="470" y="344" text-anchor="middle">same inputs → same outputs (tolerance 1e-2) · run on every layer</text>

<line class="ln" x1="190" y1="258" x2="190" y2="300" marker-end="url(#a)"/>
<line class="ln" x1="730" y1="258" x2="730" y2="300" marker-end="url(#a)"/>

<rect class="box-n" x="330" y="386" width="340" height="48" rx="3"/>
<text class="t-name" x="500" y="408" text-anchor="middle">translate_model.bin</text>
<text class="t-sub" x="500" y="424" text-anchor="middle">write_matrix / read_matrix — identical format</text>
<line class="ln" x1="500" y1="356" x2="500" y2="382" marker-end="url(#a)"/>
<text class="t-edge" x="690" y="374">interchangeable CPU ↔ GPU</text>
</svg>
