<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1132 512" width="1132" height="512" role="img" aria-label="Un tour de permutation enchaîne trois couches : addition d'une constante de tour dans le mot X2, substitution par 64 boîtes-S de 5 bits appliquées en tranches de bits sur les cinq mots, puis diffusion linéaire par rotations et XOR. En matériel, ce tour est combinatoire et bouclé sur un registre d'état : un tour par coup d'horloge.">
<title>ASCON — un tour de permutation, et son implémentation</title>
<style>
svg{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#131A1F;--muted:#59686F;--line:#C3CDD2;--cpu:#2F6382;--gpu:#A85C1B;--cpuSoft:#E1ECF3;--gpuSoft:#F7E9DB;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#0F1418;--surface:#171E23;--ink:#E5EBEE;--muted:#93A3AC;--line:#2C3841;--cpu:#79B4D8;--gpu:#E19A57;--cpuSoft:#16242E;--gpuSoft:#2A1F14}}
.bg{fill:var(--bg)}
.t-name{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px;font-weight:500;fill:var(--ink)}
.t-sub{font-size:10.5px;fill:var(--muted)}
.t-lane{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.1em}
.t-edge{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10.5px;fill:var(--muted)}
.t-small{font-size:10px;fill:var(--muted)}
.t-word{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;fill:var(--ink)}
.box-cpu{fill:var(--surface);stroke:var(--cpu);stroke-width:1.4}
.box-gpu{fill:var(--surface);stroke:var(--gpu);stroke-width:1.4}
.box-n{fill:var(--surface);stroke:var(--line);stroke-width:1.3}
.lane-gpu{fill:var(--gpuSoft);stroke:var(--gpu);stroke-width:1}
.ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.ln-loop{stroke:var(--cpu);stroke-width:1.6;fill:none;stroke-dasharray:5 4}
.a-ink{fill:var(--ink)}.a-cpu{fill:var(--cpu)}
</style>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon class="a-ink" points="0,0.6 8.4,4.5 0,8.4"/></marker>
<marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon class="a-cpu" points="0,0.6 8.4,4.5 0,8.4"/></marker>
</defs>
<rect class="bg" x="-16" y="-16" width="1132" height="512"/>

<!-- ===================== Partie haute : les 3 couches ===================== -->
<rect class="lane-gpu" x="20" y="24" width="1076" height="208" rx="6"/>
<text class="t-lane" x="40" y="48" fill="var(--gpu)">UN TOUR DE PERMUTATION — TROIS COUCHES SUCCESSIVES</text>

<!-- Pc -->
<rect class="box-gpu" x="40" y="70" width="320" height="140" rx="4"/>
<text class="t-name" x="60" y="94">Pc — addition de constante</text>
<text class="t-sub" x="60" y="116">Une constante de tour (F0, E1, D2 … 4B)</text>
<text class="t-sub" x="60" y="132">est XORée dans l'octet de poids faible</text>
<text class="t-sub" x="60" y="148">du mot X2.</text>
<text class="t-small" x="60" y="174">Rôle : casser la symétrie entre les tours,</text>
<text class="t-small" x="60" y="189">pour qu'aucun tour ne ressemble au suivant.</text>

<!-- Ps -->
<rect class="box-gpu" x="380" y="70" width="320" height="140" rx="4"/>
<text class="t-name" x="400" y="94">Ps — substitution</text>
<text class="t-sub" x="400" y="116">64 boîtes-S de 5 bits en parallèle.</text>
<text class="t-sub" x="400" y="132">La i-ème boîte prend le bit i de chacun</text>
<text class="t-sub" x="400" y="148">des 5 mots : une tranche verticale.</text>
<text class="t-small" x="400" y="174">Rôle : la non-linéarité. C'est la seule</text>
<text class="t-small" x="400" y="189">couche que l'on ne peut pas « défaire » par XOR.</text>

<!-- Pl -->
<rect class="box-gpu" x="720" y="70" width="336" height="140" rx="4"/>
<text class="t-name" x="740" y="94">Pl — diffusion linéaire</text>
<text class="t-sub" x="740" y="116">Chaque mot est XORé avec deux copies</text>
<text class="t-sub" x="740" y="132">de lui-même, décalées circulairement :</text>
<text class="t-sub" x="740" y="148">X0 : 19 et 28 · X1 : 61 et 39 · X2 : 1 et 6 …</text>
<text class="t-small" x="740" y="174">Rôle : propager l'influence d'un bit</text>
<text class="t-small" x="740" y="189">à tout le mot en quelques tours.</text>

<line class="ln" x1="360" y1="140" x2="376" y2="140" marker-end="url(#a)"/>
<line class="ln" x1="700" y1="140" x2="716" y2="140" marker-end="url(#a)"/>

<!-- ===================== Partie basse : le datapath ===================== -->
<text class="t-lane" x="40" y="282" fill="var(--cpu)">EN MATÉRIEL — UN TOUR PAR COUP D'HORLOGE</text>

<rect class="box-n" x="40" y="302" width="104" height="52" rx="3"/>
<text class="t-name" x="92" y="326" text-anchor="middle">mux</text>
<text class="t-sub" x="92" y="342" text-anchor="middle">init / boucle</text>

<rect class="box-n" x="164" y="302" width="124" height="52" rx="3"/>
<text class="t-name" x="226" y="326" text-anchor="middle">XOR entrée</text>
<text class="t-sub" x="226" y="342" text-anchor="middle">donnée · clé</text>

<rect class="box-gpu" x="308" y="302" width="72" height="52" rx="3"/>
<text class="t-name" x="344" y="333" text-anchor="middle">Pc</text>

<rect class="box-gpu" x="400" y="302" width="72" height="52" rx="3"/>
<text class="t-name" x="436" y="333" text-anchor="middle">Ps</text>

<rect class="box-gpu" x="492" y="302" width="72" height="52" rx="3"/>
<text class="t-name" x="528" y="333" text-anchor="middle">Pl</text>

<rect class="box-n" x="584" y="302" width="124" height="52" rx="3"/>
<text class="t-name" x="646" y="326" text-anchor="middle">XOR sortie</text>
<text class="t-sub" x="646" y="342" text-anchor="middle">clé</text>

<rect class="box-cpu" x="728" y="302" width="150" height="52" rx="3"/>
<text class="t-name" x="803" y="326" text-anchor="middle">registre d'état</text>
<text class="t-sub" x="803" y="342" text-anchor="middle">320 bits</text>

<line class="ln" x1="144" y1="328" x2="160" y2="328" marker-end="url(#a)"/>
<line class="ln" x1="288" y1="328" x2="304" y2="328" marker-end="url(#a)"/>
<line class="ln" x1="380" y1="328" x2="396" y2="328" marker-end="url(#a)"/>
<line class="ln" x1="472" y1="328" x2="488" y2="328" marker-end="url(#a)"/>
<line class="ln" x1="564" y1="328" x2="580" y2="328" marker-end="url(#a)"/>
<line class="ln" x1="708" y1="328" x2="724" y2="328" marker-end="url(#a)"/>

<!-- Boucle de retour -->
<path class="ln-loop" d="M 878 328 L 918 328 L 918 388 L 92 388 L 92 358" marker-end="url(#c)"/>
<text class="t-edge" x="505" y="404" text-anchor="middle" fill="var(--cpu)">la sortie du registre revient au mux : 12 tours (p¹²) ou 6 tours (p⁶) selon la phase</text>

<!-- Prises de sortie -->
<rect class="box-n" x="928" y="302" width="128" height="52" rx="3"/>
<text class="t-name" x="992" y="322" text-anchor="middle">registres</text>
<text class="t-sub" x="992" y="338" text-anchor="middle">chiffré · tag</text>
<line class="ln" x1="878" y1="316" x2="924" y2="316" marker-end="url(#a)"/>

<text class="t-small" x="40" y="446">Les trois couches sont purement combinatoires : la profondeur logique d'un tour fixe la fréquence maximale, et le nombre de tours fixe la latence.</text>
<text class="t-small" x="40" y="464">Une FSM de Moore à 26 états séquence les phases et pilote les signaux d'activation ; un compteur de tours à double initialisation distingue p¹² de p⁶.</text>
</svg>
