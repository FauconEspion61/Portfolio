<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1132 452" width="1132" height="452" role="img" aria-label="ASCON-128 runs four phases over a 320-bit state: initialisation with 12 permutation rounds from the IV, key and nonce; absorption of associated data with 6 rounds; encryption of each plaintext block, producing a ciphertext block and applying 6 rounds; finalisation with 12 rounds producing the 128-bit authentication tag.">
<title>ASCON-128 — the four phases</title>
<style>
svg{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#131A1F;--muted:#59686F;--line:#C3CDD2;--cpu:#2F6382;--gpu:#A85C1B;--cpuSoft:#E1ECF3;--gpuSoft:#F7E9DB;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#0F1418;--surface:#171E23;--ink:#E5EBEE;--muted:#93A3AC;--line:#2C3841;--cpu:#79B4D8;--gpu:#E19A57;--cpuSoft:#16242E;--gpuSoft:#2A1F14}}
.bg{fill:var(--bg)}
.t-name{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px;font-weight:500;fill:var(--ink)}
.t-big{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:15px;font-weight:600;fill:var(--ink)}
.t-sub{font-size:10.5px;fill:var(--muted)}
.t-lane{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.1em}
.t-edge{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10.5px;fill:var(--muted)}
.t-small{font-size:10px;fill:var(--muted)}
.box-cpu{fill:var(--surface);stroke:var(--cpu);stroke-width:1.5}
.box-gpu{fill:var(--surface);stroke:var(--gpu);stroke-width:1.5}
.box-n{fill:var(--surface);stroke:var(--line);stroke-width:1.3}
.rate{fill:var(--gpuSoft);stroke:var(--gpu);stroke-width:1.2}
.cap{fill:var(--cpuSoft);stroke:var(--cpu);stroke-width:1.2}
.ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.ln-gpu{stroke:var(--gpu);stroke-width:1.4;fill:none}
.a-ink{fill:var(--ink)}.a-gpu{fill:var(--gpu)}
</style>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon class="a-ink" points="0,0.6 8.4,4.5 0,8.4"/></marker>
<marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon class="a-gpu" points="0,0.6 8.4,4.5 0,8.4"/></marker>
</defs>
<rect class="bg" x="-16" y="-16" width="1132" height="452"/>

<text class="t-lane" x="40" y="26" fill="var(--muted)">ONE 320-BIT STATE, CROSSED BY FOUR PHASES</text>

<rect class="rate" x="40" y="44" width="200" height="30" rx="3"/>
<text class="t-name" x="140" y="64" text-anchor="middle">rate — 64 bits</text>
<rect class="cap" x="240" y="44" width="400" height="30" rx="3"/>
<text class="t-name" x="440" y="64" text-anchor="middle">capacity — 256 bits</text>
<text class="t-small" x="656" y="64">data only enters through the rate; the capacity stays secret</text>

<rect class="box-cpu" x="40" y="108" width="236" height="120" rx="4"/>
<text class="t-lane" x="58" y="132" fill="var(--cpu)">1 — INITIALISATION</text>
<text class="t-big" x="58" y="158">p¹²</text>
<text class="t-sub" x="58" y="178">state ← IV ‖ key ‖ nonce</text>
<text class="t-sub" x="58" y="194">12 permutation rounds</text>
<text class="t-sub" x="58" y="210">then XOR the key at the end</text>

<rect class="box-gpu" x="300" y="108" width="236" height="120" rx="4"/>
<text class="t-lane" x="318" y="132" fill="var(--gpu)">2 — ASSOCIATED DATA</text>
<text class="t-big" x="318" y="158">p⁶</text>
<text class="t-sub" x="318" y="178">XOR the block into the rate</text>
<text class="t-sub" x="318" y="194">6 rounds per block</text>
<text class="t-sub" x="318" y="210">authenticated, not encrypted</text>

<rect class="box-gpu" x="560" y="108" width="236" height="120" rx="4"/>
<text class="t-lane" x="578" y="132" fill="var(--gpu)">3 — ENCRYPTION</text>
<text class="t-big" x="578" y="158">p⁶</text>
<text class="t-sub" x="578" y="178">C = P ⊕ rate</text>
<text class="t-sub" x="578" y="194">the rate becomes the ciphertext</text>
<text class="t-sub" x="578" y="210">6 rounds per block</text>

<rect class="box-cpu" x="820" y="108" width="236" height="120" rx="4"/>
<text class="t-lane" x="838" y="132" fill="var(--cpu)">4 — FINALISATION</text>
<text class="t-big" x="838" y="158">p¹²</text>
<text class="t-sub" x="838" y="178">XOR the key</text>
<text class="t-sub" x="838" y="194">12 permutation rounds</text>
<text class="t-sub" x="838" y="210">tag ← 128 output bits</text>

<line class="ln" x1="276" y1="168" x2="296" y2="168" marker-end="url(#a)"/>
<line class="ln" x1="536" y1="168" x2="556" y2="168" marker-end="url(#a)"/>
<line class="ln" x1="796" y1="168" x2="816" y2="168" marker-end="url(#a)"/>

<rect class="box-n" x="40" y="262" width="236" height="46" rx="3"/>
<text class="t-name" x="158" y="282" text-anchor="middle">key 128 b · nonce 128 b</text>
<text class="t-sub" x="158" y="298" text-anchor="middle">secret and public inputs</text>
<line class="ln" x1="158" y1="258" x2="158" y2="232" marker-end="url(#a)"/>

<rect class="box-n" x="300" y="262" width="236" height="46" rx="3"/>
<text class="t-name" x="418" y="282" text-anchor="middle">associated data</text>
<text class="t-sub" x="418" y="298" text-anchor="middle">headers, metadata…</text>
<line class="ln" x1="418" y1="258" x2="418" y2="232" marker-end="url(#a)"/>

<rect class="box-n" x="560" y="262" width="236" height="46" rx="3"/>
<text class="t-name" x="678" y="282" text-anchor="middle">plaintext, block by block</text>
<text class="t-sub" x="678" y="298" text-anchor="middle">64 bits at a time</text>
<line class="ln" x1="678" y1="258" x2="678" y2="232" marker-end="url(#a)"/>

<line class="ln-gpu" x1="678" y1="232" x2="678" y2="340" marker-end="url(#g)"/>
<rect class="box-gpu" x="560" y="344" width="236" height="40" rx="3"/>
<text class="t-name" x="678" y="369" text-anchor="middle">ciphertext</text>

<line class="ln-gpu" x1="938" y1="232" x2="938" y2="340" marker-end="url(#g)"/>
<rect class="box-gpu" x="820" y="344" width="236" height="40" rx="3"/>
<text class="t-name" x="938" y="369" text-anchor="middle">authentication tag — 128 bits</text>

<text class="t-small" x="40" y="414">Authenticated encryption: a single pass produces both the ciphertext and the tag. Flip one bit of the message or the associated data and the tag changes — tampering is detected.</text>
</svg>
