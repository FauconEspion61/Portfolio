<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1132 512" width="1132" height="512" role="img" aria-label="One permutation round chains three layers: adding a round constant into word X2, substitution by 64 five-bit S-boxes applied across bit slices of the five words, then linear diffusion by rotations and XOR. In hardware the round is combinational and looped onto a state register: one round per clock cycle.">
<title>ASCON — one permutation round, and its implementation</title>
<style>
svg{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#131A1F;--muted:#59686F;--line:#C3CDD2;--cpu:#2F6382;--gpu:#A85C1B;--cpuSoft:#E1ECF3;--gpuSoft:#F7E9DB;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#0F1418;--surface:#171E23;--ink:#E5EBEE;--muted:#93A3AC;--line:#2C3841;--cpu:#79B4D8;--gpu:#E19A57;--cpuSoft:#16242E;--gpuSoft:#2A1F14}}
.bg{fill:var(--bg)}
.t-name{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px;font-weight:500;fill:var(--ink)}
.t-sub{font-size:10.5px;fill:var(--muted)}
.t-lane{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.1em}
.t-edge{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10.5px;fill:var(--muted)}
.t-small{font-size:10px;fill:var(--muted)}
.box-cpu{fill:var(--surface);stroke:var(--cpu);stroke-width:1.4}
.box-gpu{fill:var(--surface);stroke:var(--gpu);stroke-width:1.4}
.box-n{fill:var(--surface);stroke:var(--line);stroke-width:1.3}
.lane-gpu{fill:var(--gpuSoft);stroke:var(--gpu);stroke-width:1}
.ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.ln-loop{stroke:var(--cpu);stroke-width:1.6;fill:none;stroke-dasharray:5 4}
.a-ink{fill:var(--ink)}.a-cpu{fill:var(--cpu)}
</style>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon class="a-ink" points="0,0.6 8.4,4.5 0,8.4"/></marker>
<marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon class="a-cpu" points="0,0.6 8.4,4.5 0,8.4"/></marker>
</defs>
<rect class="bg" x="-16" y="-16" width="1132" height="512"/>

<rect class="lane-gpu" x="20" y="24" width="1076" height="208" rx="6"/>
<text class="t-lane" x="40" y="48" fill="var(--gpu)">ONE PERMUTATION ROUND — THREE SUCCESSIVE LAYERS</text>

<rect class="box-gpu" x="40" y="70" width="320" height="140" rx="4"/>
<text class="t-name" x="60" y="94">Pc — constant addition</text>
<text class="t-sub" x="60" y="116">A round constant (F0, E1, D2 … 4B)</text>
<text class="t-sub" x="60" y="132">is XORed into the low byte</text>
<text class="t-sub" x="60" y="148">of word X2.</text>
<text class="t-small" x="60" y="174">Purpose: break the symmetry between rounds,</text>
<text class="t-small" x="60" y="189">so no round looks like the next one.</text>

<rect class="box-gpu" x="380" y="70" width="320" height="140" rx="4"/>
<text class="t-name" x="400" y="94">Ps — substitution</text>
<text class="t-sub" x="400" y="116">64 five-bit S-boxes in parallel.</text>
<text class="t-sub" x="400" y="132">The i-th box takes bit i of each of</text>
<text class="t-sub" x="400" y="148">the 5 words: a vertical slice.</text>
<text class="t-small" x="400" y="174">Purpose: non-linearity. It is the only</text>
<text class="t-small" x="400" y="189">layer that cannot be undone with a XOR.</text>

<rect class="box-gpu" x="720" y="70" width="336" height="140" rx="4"/>
<text class="t-name" x="740" y="94">Pl — linear diffusion</text>
<text class="t-sub" x="740" y="116">Each word is XORed with two copies</text>
<text class="t-sub" x="740" y="132">of itself, circularly rotated:</text>
<text class="t-sub" x="740" y="148">X0: 19 and 28 · X1: 61 and 39 · X2: 1 and 6 …</text>
<text class="t-small" x="740" y="174">Purpose: spread the influence of one bit</text>
<text class="t-small" x="740" y="189">across the whole word within a few rounds.</text>

<line class="ln" x1="360" y1="140" x2="376" y2="140" marker-end="url(#a)"/>
<line class="ln" x1="700" y1="140" x2="716" y2="140" marker-end="url(#a)"/>

<text class="t-lane" x="40" y="282" fill="var(--cpu)">IN HARDWARE — ONE ROUND PER CLOCK CYCLE</text>

<rect class="box-n" x="40" y="302" width="104" height="52" rx="3"/>
<text class="t-name" x="92" y="326" text-anchor="middle">mux</text>
<text class="t-sub" x="92" y="342" text-anchor="middle">init / loop</text>

<rect class="box-n" x="164" y="302" width="124" height="52" rx="3"/>
<text class="t-name" x="226" y="326" text-anchor="middle">input XOR</text>
<text class="t-sub" x="226" y="342" text-anchor="middle">data · key</text>

<rect class="box-gpu" x="308" y="302" width="72" height="52" rx="3"/>
<text class="t-name" x="344" y="333" text-anchor="middle">Pc</text>

<rect class="box-gpu" x="400" y="302" width="72" height="52" rx="3"/>
<text class="t-name" x="436" y="333" text-anchor="middle">Ps</text>

<rect class="box-gpu" x="492" y="302" width="72" height="52" rx="3"/>
<text class="t-name" x="528" y="333" text-anchor="middle">Pl</text>

<rect class="box-n" x="584" y="302" width="124" height="52" rx="3"/>
<text class="t-name" x="646" y="326" text-anchor="middle">output XOR</text>
<text class="t-sub" x="646" y="342" text-anchor="middle">key</text>

<rect class="box-cpu" x="728" y="302" width="150" height="52" rx="3"/>
<text class="t-name" x="803" y="326" text-anchor="middle">state register</text>
<text class="t-sub" x="803" y="342" text-anchor="middle">320 bits</text>

<line class="ln" x1="144" y1="328" x2="160" y2="328" marker-end="url(#a)"/>
<line class="ln" x1="288" y1="328" x2="304" y2="328" marker-end="url(#a)"/>
<line class="ln" x1="380" y1="328" x2="396" y2="328" marker-end="url(#a)"/>
<line class="ln" x1="472" y1="328" x2="488" y2="328" marker-end="url(#a)"/>
<line class="ln" x1="564" y1="328" x2="580" y2="328" marker-end="url(#a)"/>
<line class="ln" x1="708" y1="328" x2="724" y2="328" marker-end="url(#a)"/>

<path class="ln-loop" d="M 878 328 L 918 328 L 918 388 L 92 388 L 92 358" marker-end="url(#c)"/>
<text class="t-edge" x="505" y="404" text-anchor="middle" fill="var(--cpu)">the register output feeds back to the mux: 12 rounds (p¹²) or 6 rounds (p⁶) depending on the phase</text>

<rect class="box-n" x="928" y="302" width="128" height="52" rx="3"/>
<text class="t-name" x="992" y="322" text-anchor="middle">registers</text>
<text class="t-sub" x="992" y="338" text-anchor="middle">ciphertext · tag</text>
<line class="ln" x1="878" y1="316" x2="924" y2="316" marker-end="url(#a)"/>

<text class="t-small" x="40" y="446">The three layers are purely combinational: the logic depth of one round sets the maximum frequency, and the number of rounds sets the latency.</text>
<text class="t-small" x="40" y="464">A 26-state Moore FSM sequences the phases and drives the enable signals; a round counter with two init values distinguishes p¹² from p⁶.</text>
</svg>
