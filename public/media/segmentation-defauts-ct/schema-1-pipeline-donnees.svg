<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1132 372" width="1132" height="372" role="img" aria-label="Chaîne de génération des données : un générateur paramétrique dessine des pièces contenant des défauts internes, elles sont imprimées en 3D pleines puis scannées au tomographe ; un simple seuillage d'intensité distingue l'air de la matière, et tout vide interne à l'enveloppe devient un défaut annoté — sans annotation manuelle ni recalage CAO.">
<title>Du modèle paramétrique au masque annoté</title>
<style>
svg{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#131A1F;--muted:#59686F;--line:#C3CDD2;--cpu:#2F6382;--gpu:#A85C1B;--cpuSoft:#E1ECF3;--gpuSoft:#F7E9DB;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#0F1418;--surface:#171E23;--ink:#E5EBEE;--muted:#93A3AC;--line:#2C3841;--cpu:#79B4D8;--gpu:#E19A57;--cpuSoft:#16242E;--gpuSoft:#2A1F14}}
.bg{fill:var(--bg)}
.t-name{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px;font-weight:500;fill:var(--ink)}
.t-sub{font-size:10.5px;fill:var(--muted)}
.t-lane{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.1em}
.t-edge{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10.5px;fill:var(--muted)}
.t-small{font-size:10px;fill:var(--muted)}
.box-cpu{fill:var(--surface);stroke:var(--cpu);stroke-width:1.3}
.box-gpu{fill:var(--surface);stroke:var(--gpu);stroke-width:1.3}
.lane-cpu{fill:var(--cpuSoft);stroke:var(--cpu);stroke-width:1}
.lane-gpu{fill:var(--gpuSoft);stroke:var(--gpu);stroke-width:1}
.ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.callout{fill:none;stroke:var(--gpu);stroke-width:1.4;stroke-dasharray:5 4}
.a-ink{fill:var(--ink)}
</style>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon class="a-ink" points="0,0.6 8.4,4.5 0,8.4"/></marker>
</defs>
<rect class="bg" x="-16" y="-16" width="1132" height="372"/>

<rect class="lane-cpu" x="20" y="30" width="642" height="150" rx="6"/>
<text class="t-lane" x="38" y="54" fill="var(--cpu)">CHAÎNE PHYSIQUE — FABRIQUER LA DONNÉE</text>

<rect class="box-cpu" x="40" y="78" width="180" height="62" rx="3"/>
<text class="t-name" x="130" y="103" text-anchor="middle">générateur</text>
<text class="t-sub" x="130" y="120" text-anchor="middle">trimesh · cubes, cylindres</text>
<text class="t-sub" x="130" y="134" text-anchor="middle">5 primitives de défauts</text>

<rect class="box-cpu" x="252" y="78" width="180" height="62" rx="3"/>
<text class="t-name" x="342" y="103" text-anchor="middle">impression 3D</text>
<text class="t-sub" x="342" y="120" text-anchor="middle">FDM · 100 % remplissage</text>
<text class="t-sub" x="342" y="134" text-anchor="middle">pièce nominalement pleine</text>

<rect class="box-cpu" x="464" y="78" width="180" height="62" rx="3"/>
<text class="t-name" x="554" y="103" text-anchor="middle">tomographe RX</text>
<text class="t-sub" x="554" y="120" text-anchor="middle">volume reconstruit</text>
<text class="t-sub" x="554" y="134" text-anchor="middle">VGStudio</text>

<line class="ln" x1="220" y1="109" x2="248" y2="109" marker-end="url(#a)"/>
<line class="ln" x1="432" y1="109" x2="460" y2="109" marker-end="url(#a)"/>

<rect class="lane-gpu" x="678" y="30" width="418" height="150" rx="6"/>
<text class="t-lane" x="696" y="54" fill="var(--gpu)">DÉRIVATION — ANNOTER SANS ANNOTER</text>

<rect class="box-gpu" x="696" y="78" width="180" height="62" rx="3"/>
<text class="t-name" x="786" y="103" text-anchor="middle">seuillage</text>
<text class="t-sub" x="786" y="120" text-anchor="middle">deux modes séparés :</text>
<text class="t-sub" x="786" y="134" text-anchor="middle">air / matière</text>

<rect class="box-gpu" x="908" y="78" width="172" height="62" rx="3"/>
<text class="t-name" x="994" y="103" text-anchor="middle">masque</text>
<text class="t-sub" x="994" y="120" text-anchor="middle">vérité terrain</text>
<text class="t-sub" x="994" y="134" text-anchor="middle">voxel par voxel</text>

<line class="ln" x1="644" y1="109" x2="692" y2="109" marker-end="url(#a)"/>
<line class="ln" x1="876" y1="109" x2="904" y2="109" marker-end="url(#a)"/>

<rect class="callout" x="40" y="212" width="1040" height="52" rx="6"/>
<text class="t-name" x="60" y="235">Règle unique : tout vide interne à l'enveloppe de la pièce est un défaut.</text>
<text class="t-sub" x="60" y="253">La pièce étant imprimée pleine, seuls les défauts conçus creusent la matière — la vérité terrain se lit donc directement dans le scan.</text>

<text class="t-lane" x="40" y="306" fill="var(--gpu)">RÉSULTAT</text>
<text class="t-name" x="40" y="330">90 pièces annotées · 0 annotation manuelle · 0 recalage CAO ↔ scan</text>
</svg>
