<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1132 372" width="1132" height="372" role="img" aria-label="Data generation chain: a parametric generator draws parts containing internal defects, they are 3D printed solid then scanned on a CT system; a simple intensity threshold separates air from material, and every void inside the envelope becomes an annotated defect — with no manual labelling and no CAD registration.">
<title>From parametric model to annotated mask</title>
<style>
svg{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#131A1F;--muted:#59686F;--line:#C3CDD2;--cpu:#2F6382;--gpu:#A85C1B;--cpuSoft:#E1ECF3;--gpuSoft:#F7E9DB;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#0F1418;--surface:#171E23;--ink:#E5EBEE;--muted:#93A3AC;--line:#2C3841;--cpu:#79B4D8;--gpu:#E19A57;--cpuSoft:#16242E;--gpuSoft:#2A1F14}}
.bg{fill:var(--bg)}
.t-name{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px;font-weight:500;fill:var(--ink)}
.t-sub{font-size:10.5px;fill:var(--muted)}
.t-lane{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.1em}
.t-edge{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10.5px;fill:var(--muted)}
.t-small{font-size:10px;fill:var(--muted)}
.box-cpu{fill:var(--surface);stroke:var(--cpu);stroke-width:1.3}
.box-gpu{fill:var(--surface);stroke:var(--gpu);stroke-width:1.3}
.lane-cpu{fill:var(--cpuSoft);stroke:var(--cpu);stroke-width:1}
.lane-gpu{fill:var(--gpuSoft);stroke:var(--gpu);stroke-width:1}
.ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.callout{fill:none;stroke:var(--gpu);stroke-width:1.4;stroke-dasharray:5 4}
.a-ink{fill:var(--ink)}
</style>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon class="a-ink" points="0,0.6 8.4,4.5 0,8.4"/></marker>
</defs>
<rect class="bg" x="-16" y="-16" width="1132" height="372"/>

<rect class="lane-cpu" x="20" y="30" width="642" height="150" rx="6"/>
<text class="t-lane" x="38" y="54" fill="var(--cpu)">PHYSICAL CHAIN — MANUFACTURING THE DATA</text>

<rect class="box-cpu" x="40" y="78" width="180" height="62" rx="3"/>
<text class="t-name" x="130" y="103" text-anchor="middle">generator</text>
<text class="t-sub" x="130" y="120" text-anchor="middle">trimesh · cubes, cylinders</text>
<text class="t-sub" x="130" y="134" text-anchor="middle">5 defect primitives</text>

<rect class="box-cpu" x="252" y="78" width="180" height="62" rx="3"/>
<text class="t-name" x="342" y="103" text-anchor="middle">3D printing</text>
<text class="t-sub" x="342" y="120" text-anchor="middle">FDM · 100 % infill</text>
<text class="t-sub" x="342" y="134" text-anchor="middle">nominally solid part</text>

<rect class="box-cpu" x="464" y="78" width="180" height="62" rx="3"/>
<text class="t-name" x="554" y="103" text-anchor="middle">X-ray CT</text>
<text class="t-sub" x="554" y="120" text-anchor="middle">reconstructed volume</text>
<text class="t-sub" x="554" y="134" text-anchor="middle">VGStudio</text>

<line class="ln" x1="220" y1="109" x2="248" y2="109" marker-end="url(#a)"/>
<line class="ln" x1="432" y1="109" x2="460" y2="109" marker-end="url(#a)"/>

<rect class="lane-gpu" x="678" y="30" width="418" height="150" rx="6"/>
<text class="t-lane" x="696" y="54" fill="var(--gpu)">DERIVATION — LABELS FOR FREE</text>

<rect class="box-gpu" x="696" y="78" width="180" height="62" rx="3"/>
<text class="t-name" x="786" y="103" text-anchor="middle">thresholding</text>
<text class="t-sub" x="786" y="120" text-anchor="middle">two separate modes:</text>
<text class="t-sub" x="786" y="134" text-anchor="middle">air / material</text>

<rect class="box-gpu" x="908" y="78" width="172" height="62" rx="3"/>
<text class="t-name" x="994" y="103" text-anchor="middle">mask</text>
<text class="t-sub" x="994" y="120" text-anchor="middle">ground truth</text>
<text class="t-sub" x="994" y="134" text-anchor="middle">voxel by voxel</text>

<line class="ln" x1="644" y1="109" x2="692" y2="109" marker-end="url(#a)"/>
<line class="ln" x1="876" y1="109" x2="904" y2="109" marker-end="url(#a)"/>

<rect class="callout" x="40" y="212" width="1040" height="52" rx="6"/>
<text class="t-name" x="60" y="235">One rule: every void inside the part's envelope is a defect.</text>
<text class="t-sub" x="60" y="253">Since the part is printed solid, only the designed defects hollow out material — so ground truth reads straight off the scan.</text>

<text class="t-lane" x="40" y="306" fill="var(--gpu)">RESULT</text>
<text class="t-name" x="40" y="330">90 annotated parts · 0 manual labels · 0 CAD ↔ scan registration</text>
</svg>
