<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1132 432" width="1132" height="432" role="img" aria-label="Trois jeux de données se succèdent : 63 volumes de CT médical servent au pré-entraînement, 90 pièces imprimées annotées automatiquement servent à l'étude d'efficacité en données, et 9 pièces industrielles réelles servent de validation finale. Deux enseignements : affiner sur sept pièces réelles bat un entraînement sur neuf fois plus de pièces imprimées, et le CT médical est distributionnellement plus proche du réel que ne l'est le jeu imprimé.">
<title>Trois domaines d'images, une question d'efficacité en données</title>
<style>
svg{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#131A1F;--muted:#59686F;--line:#C3CDD2;--cpu:#2F6382;--gpu:#A85C1B;--cpuSoft:#E1ECF3;--gpuSoft:#F7E9DB;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#0F1418;--surface:#171E23;--ink:#E5EBEE;--muted:#93A3AC;--line:#2C3841;--cpu:#79B4D8;--gpu:#E19A57;--cpuSoft:#16242E;--gpuSoft:#2A1F14}}
.bg{fill:var(--bg)}
.t-name{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px;font-weight:500;fill:var(--ink)}
.t-big{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:19px;font-weight:600;fill:var(--ink)}
.t-sub{font-size:10.5px;fill:var(--muted)}
.t-lane{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.1em}
.t-edge{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10.5px;fill:var(--muted)}
.box-n{fill:var(--surface);stroke:var(--line);stroke-width:1.3}
.box-cpu{fill:var(--surface);stroke:var(--cpu);stroke-width:1.6}
.box-gpu{fill:var(--surface);stroke:var(--gpu);stroke-width:1.6}
.ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.ln-gpu{stroke:var(--gpu);stroke-width:1.6;fill:none}
.find{fill:var(--gpuSoft);stroke:var(--gpu);stroke-width:1.2}
.a-ink{fill:var(--ink)}.a-gpu{fill:var(--gpu)}
</style>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon class="a-ink" points="0,0.6 8.4,4.5 0,8.4"/></marker>
<marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><polygon class="a-gpu" points="0,0.6 8.4,4.5 0,8.4"/></marker>
</defs>
<rect class="bg" x="-16" y="-16" width="1132" height="432"/>

<text class="t-lane" x="40" y="30" fill="var(--muted)">LES TROIS DOMAINES D'IMAGES DU PROJET</text>

<rect class="box-cpu" x="40" y="52" width="316" height="118" rx="4"/>
<text class="t-lane" x="60" y="78" fill="var(--cpu)">SOURCE — MÉDICAL</text>
<text class="t-big" x="60" y="106">63 volumes</text>
<text class="t-sub" x="60" y="126">CT thoraciques publics (Task06_Lung)</text>
<text class="t-sub" x="60" y="142">abondants, annotés, documentés</text>
<text class="t-sub" x="60" y="158">→ point de contrôle de pré-entraînement</text>

<rect class="box-n" x="398" y="52" width="316" height="118" rx="4"/>
<text class="t-lane" x="418" y="78" fill="var(--muted)">SUBSTITUT — IMPRIMÉ</text>
<text class="t-big" x="418" y="106">90 pièces</text>
<text class="t-sub" x="418" y="126">fabriquées et annotées automatiquement</text>
<text class="t-sub" x="418" y="142">défauts conçus, vérité terrain gratuite</text>
<text class="t-sub" x="418" y="158">→ courbe d'efficacité, N = 5 … 63</text>

<rect class="box-gpu" x="756" y="52" width="324" height="118" rx="4"/>
<text class="t-lane" x="776" y="78" fill="var(--gpu)">CIBLE — INDUSTRIEL RÉEL</text>
<text class="t-big" x="776" y="106">9 pièces</text>
<text class="t-sub" x="776" y="126">vrais défauts d'usinage</text>
<text class="t-sub" x="776" y="142">masques corrigés à la main (3D Slicer)</text>
<text class="t-sub" x="776" y="158">→ validation croisée leave-one-out</text>

<line class="ln" x1="356" y1="111" x2="394" y2="111" marker-end="url(#a)"/>
<text class="t-edge" x="375" y="100" text-anchor="middle">pré-entraînement</text>

<line class="ln" x1="714" y1="111" x2="752" y2="111" marker-end="url(#a)"/>
<text class="t-edge" x="733" y="100" text-anchor="middle">transfert</text>

<rect class="find" x="40" y="212" width="1040" height="86" rx="6"/>
<text class="t-lane" x="60" y="238" fill="var(--gpu)">RÉSULTAT PRINCIPAL</text>
<text class="t-name" x="60" y="264">Affiner sur 7 pièces réelles bat un entraînement sur 63 pièces imprimées — Dice multiplié par 1,8 à 2,1.</text>
<text class="t-sub" x="60" y="284">Une poignée de données du domaine cible vaut mieux qu'un volume neuf fois supérieur de données de substitution.</text>

<rect class="box-n" x="40" y="322" width="1040" height="78" rx="6"/>
<text class="t-lane" x="60" y="348" fill="var(--muted)">ANALYSE COMPLÉMENTAIRE — SIMILARITÉ DES DOMAINES</text>
<text class="t-name" x="60" y="374">Le CT médical est plus proche du réel (Wasserstein 0,159) que le jeu imprimé ne l'est (0,402).</text>
<text class="t-sub" x="60" y="392">Contre-intuitif : le domaine atypique des trois n'est pas le médical, mais celui fabriqué sur mesure — les pièces imprimées sont presque pleines.</text>
</svg>
